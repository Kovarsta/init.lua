# .psmux.conf
# Deployed (tracked copy) to ~/.psmux.conf, which psmux auto-loads.
#
# Prefix (Ctrl+Space) == nvim <leader>.
# RULE: the root table (no prefix) holds ONLY modifier+arrow chords.
# Never bind a printable letter / Shift+letter at root -- it is consumed
# before the pane sees it, so typed characters vanish (the "Pie" bug).

# =============================================================================
# CHEAT SHEET
#   PREFIX = Ctrl+Space (press, release, then the key). Root keys need no prefix.
#
#   PANES
#     Alt+Arrow .......... move pane (left/right/up/down)
#     Prefix v / h ....... split vertical (side-by-side) / horizontal (stacked)
#     Prefix x ........... close pane (y/n)          Prefix z ......... zoom pane
#     Prefix Arrows ...... move pane (same as Alt+Arrow)
#     Prefix o ........... next pane                 Prefix ; ......... last pane
#     Prefix q ........... show pane numbers         Prefix % / " ..... split left|right / top|bottom
#     Prefix C-Arrow ..... resize 1 cell             Prefix Alt-Arrow . resize 5 cells
#   WINDOWS (tabs)
#     Shift+Left / Right . prev / next window
#     Prefix c ........... new window                Prefix n / p ..... next / prev window
#     Prefix l ........... last window               Prefix w ......... window/pane tree
#     Prefix r (or ,) .... rename window             Prefix X / & ..... close window (y/n)
#   LAYOUTS
#     Prefix Space ....... next layout               Prefix Alt+1..5 .. even-h / even-v /
#     Prefix = ........... re-balance (tiled)                             main-h / main-v / tiled
#   SESSIONS / MISC
#     Prefix s ........... session chooser           Prefix $ ......... rename session
#     Prefix ( / ) ....... prev / next session        Prefix d ......... detach
#     Prefix D ........... end session (y/n)         Prefix : ......... command prompt
#     Prefix ? ........... list all keys             Prefix t ......... clock
#   COPY / PASTE  (press Prefix [ to enter copy mode, q or Esc to leave)
#     v ............ start selection (like nvim visual)     y .......... copy + exit
#     C-v .......... block/rectangle selection              F1 / F2 .... line start / end
#     Space = start, V = line select, h/j/k/l move, w/b/e words, 0 $ ^ line, / ? search
#     Prefix ] ..... paste psmux buffer    Ctrl+Shift+V / right-click ..... paste OS clipboard
#     Mouse: click pane to focus, drag border to resize, wheel to scroll, drag to select
# =============================================================================

# ---- prefix ("leader") ----
unbind C-b
set -g prefix C-Space

# ---- root table: modifier chords only ----
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n S-Left  previous-window
bind-key -n S-Right next-window

# ---- prefix table: mirrors <leader> ----
bind-key v split-window -h                                       # <leader>v  vertical split
bind-key h split-window -v                                       # <leader>h  horizontal split
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane     # <leader>sx close split
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window # <leader>bc close window
bind-key = select-layout tiled                                   # <leader>se re-balance
bind-key r rename-window                                         # rename current window (same as Prefix ,)
bind-key D confirm-before -p "kill-session #S? (y/n)" kill-session  # hard exit: end this session

# psmux defaults already cover: c new-window, n/p cycle, z zoom,
# [ / ] copy mode / paste, Space cycle layout, s sessions, w tree, d detach.
# Resize: Prefix+Ctrl+Arrow (1 cell) / Prefix+Alt+Arrow (5 cells).

# ---- copy mode: make v behave like nvim visual ----
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection            # v    start selection (nvim visual)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle           # C-v  block selection (nvim visual-block)
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel  # y    copy selection + exit (clipboard)
bind-key -T copy-mode-vi F1  send-keys -X start-of-line          # <F1> like nvim: go to start of line (0)
bind-key -T copy-mode-vi F2  send-keys -X end-of-line            # <F2> like nvim: go to end of line ($)

# ---- options ----
set -g mouse on
set -g mouse-selection off        # let nvim/opencode own their selection
set -g paste-detection off        # let Ctrl+V reach nvim (visual block)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-predictions on      # keep PSReadLine predictive history (psmux forces it off otherwise)
