# =============================================================================
# ~/.psmux.nvim.conf
# -----------------------------------------------------------------------------
# psmux keybindings aligned with kovarsta's neovim keymap
#
# Mental model: psmux's PREFIX (Ctrl+Space) plays the same role as neovim's
# <leader> (Space). Keys bound without a prefix mirror neovim's Ctrl/Shift
# chords. So "Prefix + v" below == "Space + v" inside neovim.
#
# HOW TO LOAD:
#   Option 1 (recommended): append one line to the END of ~/.psmux.conf
#       source-file ~/.psmux.nvim.conf
#     then reload with "Prefix + R" (psmux-sensible) or run:
#       psmux source-file ~/.psmux.conf
#
#   Option 2: use it as the entire config for a session
#       psmux -f ~/.psmux.nvim.conf
#     NOTE: your plugin/theme lines in ~/.psmux.conf will NOT load in this
#     mode. If you go this route, uncomment the "run" line at the bottom.
#
# Everything below is tmux-compatible config syntax.
# =============================================================================

# -----------------------------------------------------------------------------
# PREFIX ("leader")
# -----------------------------------------------------------------------------
unbind C-b                 # remove the default Ctrl+b prefix
set -g prefix C-Space      # prefix = Ctrl+Space -> the psmux "leader" (Space in nvim)
bind C-Space send-prefix   # press the prefix twice to send a literal Ctrl+Space to the pane

# -----------------------------------------------------------------------------
# PANE NAVIGATION          (neovim: <C-h> <C-j> <C-k> <C-l>)
# -----------------------------------------------------------------------------
# Ctrl+h/j/k/l move between panes exactly like they move between splits in
# neovim (remap.lua "Move between splits"). The if-shell guard forwards the key
# to the focused app when it is a shell or vim, so <C-l> still clears the
# screen in pwsh and neovim keeps handling its own split navigation. Everywhere
# else psmux selects the pane in that direction.
bind-key -n C-h if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys C-h" "select-pane -L"   # <C-h>  pane on the left
bind-key -n C-j if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys C-j" "select-pane -D"   # <C-j>  pane below
bind-key -n C-k if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys C-k" "select-pane -U"   # <C-k>  pane above
bind-key -n C-l if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys C-l" "select-pane -R"   # <C-l>  pane on the right

# Alt+Arrow: same pane navigation, no prefix (kept from your old config).
bind-key -n M-Left  select-pane -L   # <M-Left>  pane on the left
bind-key -n M-Right select-pane -R   # <M-Right> pane on the right
bind-key -n M-Up    select-pane -U   # <M-Up>    pane above
bind-key -n M-Down  select-pane -D   # <M-Down>  pane below

# -----------------------------------------------------------------------------
# SPLITTING                (neovim: <leader>v  <leader>h)
# -----------------------------------------------------------------------------
# Prefix + v / Prefix + h create splits exactly like "Space + v / h" do in
# neovim (remap.lua "Create splits").
# tmux gotcha: the -h / -v flags describe the DIVIDER, which is the opposite of
# what your eyes see in vim:
#   split-window -h  draws a | divider  -> panes sit side by side (left|right)
#   split-window -v  draws a - divider  -> panes stack top/bottom
bind-key v split-window -h          # <leader>v  split left|right (nvim <C-w>v "vertical split")
bind-key h split-window -v          # <leader>h  split top/bottom  (nvim <C-w>s "horizontal split")
# NOTE: this overrides psmux's default "Prefix + v" (rectangle-toggle mirror in
# copy mode). Rectangular selection still works via "C-v" inside copy mode.

# tmux-standard split keys, kept as alternates / muscle memory.
bind-key | split-window -h          # prefix + |  split left|right
bind-key - split-window -v          # prefix + -  split top/bottom

# Default split keys, kept but opening the new pane in the same directory.
bind '"' split-window -v -c "#{pane_current_path}"    # prefix + "  split top/bottom in current dir
bind %   split-window -h -c "#{pane_current_path}"    # prefix + %  split left|right in current dir

# -----------------------------------------------------------------------------
# RESIZE                   (neovim: <C-Up> <C-Down> <C-Left> <C-Right>)
# -----------------------------------------------------------------------------
# Matches remap.lua "Resize splits with arrows" (+2 / -2 cells).
bind-key -n C-Up    resize-pane -U 2   # <C-Up>    grow pane height by 2   (nvim resize +2)
bind-key -n C-Down  resize-pane -D 2   # <C-Down>  shrink pane height by 2 (nvim resize -2)
bind-key -n C-Left  resize-pane -L 2   # <C-Left>  shrink pane width by 2  (nvim vertical resize -2)
bind-key -n C-Right resize-pane -R 2   # <C-Right> grow pane width by 2    (nvim vertical resize +2)

# -----------------------------------------------------------------------------
# WINDOW / TAB CYCLING     (neovim: <S-h> <S-l> = BufferLine prev/next)
# -----------------------------------------------------------------------------
# neovim's <S-h>/<S-l> cycle tabs (remap.lua "Standard cycling"); psmux windows
# are the equivalent of tabs, so the same keys cycle windows. The guard forwards
# Shift+h/l to shells/vim, so typing capital H/L in pwsh still works and nvim
# keeps its own <S-h>/<S-l> bindings. In other full-screen apps these switch
# windows instead -- comment these two lines out if that annoys you.
bind-key -n H if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys H" "previous-window"   # <S-h>  previous window/tab
bind-key -n L if-shell -F "#{m/r:^(pwsh|powershell|n?vim)$,#{pane_current_command}}" "send-keys L" "next-window"       # <S-l>  next window/tab

# Shift+Arrow: same window switching, no impact on typed letters (kept).
bind-key -n S-Left  previous-window   # <S-Left>  previous window
bind-key -n S-Right next-window       # <S-Right> next window

# -----------------------------------------------------------------------------
# CLOSE / REBALANCE        (neovim: <leader>sx  <leader>bc  <leader>se)
# -----------------------------------------------------------------------------
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane    # <leader>sx  close the current split (pane), with confirm
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window # <leader>bc  close the current window (tab/buffer), with confirm
bind-key = select-layout                                        # <leader>se  re-apply layout so panes are (roughly) equal
# NOTE: "=" replaces psmux's default "Prefix + =" buffer chooser. Buffers are
# still reachable via "Prefix + #" (list-buffers) and "Prefix + ]" pastes.

# -----------------------------------------------------------------------------
# COPY MODE (vi)           (neovim: v  C-v  y)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi                                # vi-style copy-mode keys
bind-key -T copy-mode-vi v   send-keys -X begin-selection            # v    start selection (like nvim visual)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle           # C-v  blockwise selection (nvim visual-block)
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel  # y    yank selection + leave copy mode (nvim y)
# Copy-mode motion already mirrors nvim: h/j/k/l, w/b/e, 0/$/^, / ? n N,
# f/t/;/,, H/M/L, y, Esc/q. n/N are next/previous match like nvim's n/N.

# -----------------------------------------------------------------------------
# SETTINGS the bindings rely on
# -----------------------------------------------------------------------------
set -g mouse on                      # mouse: click panes, scroll, drag-select, drag borders
set -g base-index 1                  # windows start at 1, not 0
set -g pane-base-index 1             # panes start at 1, not 0
set-window-option -g pane-base-index 1
set-option -g renumber-windows on    # renumber windows after one is closed

# -----------------------------------------------------------------------------
# REFERENCE: psmux defaults that already map onto the neovim keymap
# (defaults -- listed here for reference, no need to bind them)
# -----------------------------------------------------------------------------
#   Prefix + c     create a new window (tab)
#   Prefix + n/p   next / previous window (S-h/S-l above also do this)
#   Prefix + l     last (previously active) window
#   Prefix + s     session chooser        Prefix + w  window/pane tree
#   Prefix + d     detach from psmux
#   Prefix + &     kill current window (confirm)
#   Prefix + ,     rename current window
#   Prefix + q     show pane numbers      Prefix + o  next pane
#   Prefix + z     zoom/unzoom current pane (like nvim fullscreen a split)
#   Prefix + [ / ] enter copy mode / paste last buffer
#   Prefix + Space cycle pane layouts
#   Prefix + C-Arrows  resize by 1 cell   Prefix + M-Arrows  resize by 5 cells

# Only needed if you launch psmux with "-f ~/.psmux.nvim.conf":
# run '~/.psmux/plugins/ppm/ppm.ps1'
